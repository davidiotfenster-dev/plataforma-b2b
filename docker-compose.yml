# SOLO PARA DESARROLLO LOCAL. En producción la base de datos es Amazon RDS y Redis
# ElastiCache (ver DESPLIEGUE_AWS.md): no se usa este fichero.
# Los puertos se publican solo en 127.0.0.1 para que no queden abiertos a la red.
services:
  postgres:
    image: postgres:16
    container_name: fenster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fenster
      POSTGRES_PASSWORD: fenster_dev
      POSTGRES_DB: fenster
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fenster_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fenster-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - fenster_redisdata:/data

volumes:
  fenster_pgdata:
  fenster_redisdata:
